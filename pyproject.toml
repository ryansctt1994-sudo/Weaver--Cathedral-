[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-cathedral"
version = "0.1.0"
description = "Governed verification spine for Weaver Cathedral Master Build"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6.100,<7",
  "jsonschema>=4.20,<5",
]

[project.scripts]
weaver-authority = "core.authority.cli:main"
weaver-claude-gate = "runtime.claude_code_gate.hook:main"

[tool.setuptools.packages.find]
include = ["core*", "runtime*"]

[tool.setuptools.package-data]
"runtime.claude_code_gate" = ["*.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["core/authority/tests", "tests", "skills"]
pythonpath = ["."]
