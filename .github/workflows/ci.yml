name: CI

on:
  push:
    branches: ["main", "phase-1-authority-spine"]
  pull_request:
    branches: ["main"]

jobs:
  authority-spine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # R7: the G3 override path needs cryptography; install it explicitly.
          python -m pip install "cryptography>=42"

      # The gate's trust anchor must be root-owned (an agent running as a
      # non-root identity cannot forge one), so the suite runs as root.
      - name: Run tests
        run: sudo -E env "PATH=$PATH" python -m pytest -q

      - name: G3 tests must run, not skip (R7)
        run: |
          sudo -E env "PATH=$PATH" python -m pytest -q -p no:cacheprovider tests/test_claude_code_role_gate_override.py --junitxml=g3-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("g3-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          tests, skipped, errors, failures = (int(suite.get(k, 0)) for k in ("tests", "skipped", "errors", "failures"))
          print(f"G3: {tests} tests, {skipped} skipped, {errors} errors, {failures} failures")
          assert tests > 0 and skipped == 0 and errors == 0 and failures == 0
          PY

      - name: GAP-003 candidate regression and mutation checks (R1, R5, R6)
        run: |
          sudo -E env "PATH=$PATH" python forge/demos/gap003_r1r7_candidate/regression_check.py --out regression_report.json
          sudo -E env "PATH=$PATH" python forge/demos/gap003_r1r7_candidate/mutations.py --out mutations_report.json

      - name: Return the checkout to the runner user before the demo
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Run authority spine demo
        run: |
          bash forge/demos/authority_spine_001/scripts/run.sh
          bash forge/demos/authority_spine_001/scripts/verify.sh

      # bundle.py runs the whole suite too, so it also needs root for the anchor.
      - name: Build and verify evidence bundle
        run: |
          sudo -E env "PATH=$PATH" python forge/demos/authority_spine_001/scripts/bundle.py forge/demos/authority_spine_001/bundle
          python forge/demos/authority_spine_001/scripts/verify_bundle.py forge/demos/authority_spine_001/bundle

      - name: Return the checkout to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle-py${{ matrix.python-version }}
          path: forge/demos/authority_spine_001/bundle
          if-no-files-found: error

  claim-audit:
    # governance.claim_audit enforces the Blocking Rule in governance/open_gap_ledger.md:
    # an unbacked blocked term anywhere in the repo fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Audit claims
        run: python skills/governance/claim_audit/claim_audit.py . --json claim-audit-report.json

      - name: Upload claim audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-audit-report
          path: claim-audit-report.json

  bundle-determinism:
    # Replay across interpreters: every deterministic bundle file must be
    # byte-identical whichever Python version built it.
    needs: authority-spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-bundle-py*
          path: bundles

      - name: Compare deterministic files across Python versions
        run: |
          python - <<'PY'
          import json, pathlib, sys
          manifests = {p.parent.name: json.loads(p.read_text()) for p in sorted(pathlib.Path("bundles").glob("*/MANIFEST.json"))}
          assert len(manifests) >= 2, f"expected one bundle per Python version, got {sorted(manifests)}"
          names = {n for m in manifests.values() for n in m["deterministic_files"]}
          bad = [n for n in sorted(names) if len({m["bundle_files"].get(n) for m in manifests.values()}) != 1]
          heads = {m["chronicle_head"] for m in manifests.values()}
          print(f"{len(manifests)} bundles, {len(names)} deterministic files, chronicle heads: {heads}")
          if bad or len(heads) != 1:
              print("differs across versions:", bad)
              sys.exit(1)
          PY
